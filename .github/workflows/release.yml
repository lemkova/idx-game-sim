name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/idx-game-sim.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath idx-game-sim-windows-x64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" idx-game-sim-windows-x64.zip `
            --title "idx-game-sim ${{ github.ref_name }}" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload "${{ github.ref_name }}" idx-game-sim-windows-x64.zip --clobber
          }
